# www is mapped to the same Cloud Run service; send it to the apex.
server {
  listen 8080;
  server_name www.zerpy.dev;
  return 301 https://zerpy.dev$request_uri;
}

server {
  listen 8080 default_server;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Cloud Run terminates TLS and forwards to 8080; never leak that port into a redirect.
  absolute_redirect off;

  gzip on;
  gzip_min_length 512;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Vite fingerprints everything under /assets, so it can be cached forever.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # index.html must be revalidated so a new deploy is picked up immediately.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
